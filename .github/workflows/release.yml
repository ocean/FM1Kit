name: Release

# When a release is published, checks its tag matches fm1probe's version, then opens a pull
# request in ocean/homebrew-tap that points the formula at the release's source archive.
on:
  release:
    types: [published]

permissions: {}

# Releases update the formula one at a time, and a newer one never cancels a pull request half made.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  homebrew:
    name: Update the Homebrew formula
    # Pre-releases stay out of the tap.
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    # The environment holds HOMEBREW_TAP_TOKEN, and only release tags can deploy to it.
    environment: homebrew-tap
    permissions:
      contents: read # To check out the code.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag matches fm1probe's version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(sed -n 's/^let fm1probeVersion = "\(.*\)"$/\1/p' Sources/fm1probe/Usage.swift)
          if [ "$TAG" != "$version" ]; then
            echo "::error::The tag is $TAG, but fm1probeVersion is $version."
            exit 1
          fi
      - uses: mislav/bump-homebrew-formula-action@f865c8b0dbebd6e263cc06782a0e974c61cf12d2 # v4.2
        with:
          formula-name: fm1probe
          homebrew-tap: ocean/homebrew-tap
          create-pullrequest: true
        env:
          # A fine-grained token with contents and pull-request write access to ocean/homebrew-tap only.
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
