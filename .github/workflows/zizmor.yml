name: zizmor

# Scans the workflows for security problems, and reports findings to GitHub code scanning.
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

# A newer push to the same branch or pull request cancels the run still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Scan workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read # To check out the code.
      security-events: write # To upload findings to code scanning.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          # Pinned, as Dependabot doesn't update this; 1.30.1 was released on 2026-09-09.
          version: 1.30.1
